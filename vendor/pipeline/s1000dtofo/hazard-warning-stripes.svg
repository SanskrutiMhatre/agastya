<?xml version="1.0" encoding="UTF-8"?>
<!-- Same construction as hazard-caution-stripes.svg, red/white for WARNING.
     See that file's own comment for why this tiles without a seam. -->
<svg xmlns="http://www.w3.org/2000/svg" width="12mm" height="12mm" viewBox="0 0 40 40">
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="40" height="20" fill="#CC0000"/>
      <rect x="0" y="20" width="40" height="20" fill="#FFFFFF"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="40" height="40" fill="url(#stripes)"/>
</svg>
